id: grounding-54321
name: "Grounding 5-4-3-2-1: trở về hiện tại"
type: grounding
duration_min: 3
source_id: who-stress-guide
helps_with: [căng thẳng, lo âu, quá tải cảm xúc]
summary: >-
  Nhẹ nhàng để ý xung quanh để đưa sự chú ý về hiện tại khi cảm xúc dâng cao.
steps:
  - Gọi tên 5 thứ bạn đang nhìn thấy.
  - Để ý 4 điều bạn cảm nhận được bằng cơ thể, ví dụ bàn chân chạm sàn.
  - Lắng nghe 3 âm thanh quanh bạn.
  - Nhận ra 2 mùi hương.
  - Để ý 1 vị trong miệng.
  - Có thể dừng hoặc bỏ qua bất kỳ bước nào không thoải mái.
